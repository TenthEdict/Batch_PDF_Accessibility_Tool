# Configuration optimized for academic papers distributed on digital commons platforms
# Intelligent OCR with compression settings - Prevents PDF corruption

# Intelligent OCR settings - only applies OCR when needed
ocr:
  language: eng
  psm: 1  # Automatic page segmentation with OSD
  oem: 3  # LSTM + Legacy engine for academic content
  dpi: 150  # Reduced for web viewing (150 DPI optimal for screens)
  tessdata_dir: /usr/share/tesseract-ocr/5/tessdata
  
  # Intelligent OCR detection settings
  intelligent_ocr: true                       # Enable intelligent OCR detection
  text_threshold: 100                         # Minimum avg chars/page to skip OCR
  sample_pages: 3                             # Number of pages to analyze for text content
  force_ocr_override: false                   # Override intelligent detection (force OCR always)
  
  # Enhanced academic content recognition (when OCR is applied)
  additional_params:
    textord_tablefind_recognize_tables: 1    # Enhanced table detection
    textord_tabfind_find_tables: 1          # Academic table processing
    tessedit_enable_doc_dict: 1             # Dictionary support for academic terms
    tessedit_preserve_interword_spaces: 1   # Preserve academic spacing
    language_model_ngram_on: 1              # Language modeling for academic text
    textord_heavy_nr: 1                     # Better layout analysis for papers
    textord_show_initial_words: 1           # Better word detection

# Adobe Acrobat compatible compression settings for academic papers
compression:
  adobe_compatible: true                    # Prioritize Adobe Acrobat compatibility
  preserve_image_structure: true           # Don't modify image objects
  target_dpi: 150                          # Optimal for web viewing
  stream_compression: true                 # Compress content streams only
  optimize_fonts: true                     # Font subsetting and optimization
  clean_metadata: true                     # Remove non-essential metadata
  structure_preservation: true             # Maintain PDF structure integrity
  garbage_collection_level: 2             # Moderate cleanup (safer than aggressive)

# Content detection settings for academic papers
content_detection:
  formulas: true
  tables: true
  figures: true
  charts: true
  citations: true
  references: true
  
# Structure detection for academic papers (minimal processing)
structure:
  detect_sections: false                    # Disable auto-detection to avoid dummy tags
  detect_columns: false                     # Disable auto-detection to avoid dummy tags  
  detect_headings: false                    # Disable auto-detection to avoid dummy tags
  detect_paragraphs: false                  # Disable auto-detection to avoid dummy tags
  # Note: Clean structure approach - no auto-generated content tags
  
# Performance settings optimized for cross-platform compatibility (macOS Silicon + Ubuntu WSL)
performance:
  max_workers: 4
  batch_size: 10
  timeout: 600
  retry_count: 3
  
# Validation for minimal PDF/UA-1 compliance
validation:
  accessibility_standard: PDFUA1           # PDF/UA-1 compliance
  check_reading_order: false               # Skip to avoid auto-tagging
  check_table_headers: false               # Skip to avoid auto-tagging  
  check_alt_text: false                    # Skip to avoid auto-tagging
  check_language: true                     # Essential for accessibility
  check_metadata: true                     # Essential for accessibility

# Academic-specific settings for web distribution
academic:
  # Citation patterns (for OCR recognition, not tagging)
  citation_patterns:
    author_year: true      # e.g., (Smith, 2020)
    numeric: true          # e.g., [1] or [1-3]
    superscript: true      # e.g., ¹²³
    
  # Math detection (for OCR accuracy, not tagging)
  math_detection:
    inline_math: true      # Detect inline equations
    display_math: true     # Detect display/block equations
    greek_symbols: true    # Detect Greek letters and math symbols
    
  # Processing enhancements - optimized for aggressive web compression
  preprocessing:
    enhance_contrast: false   # Disable to prevent image reprocessing
    denoise: false           # Academic papers rarely need denoising
    sharpen: false           # Disable to prevent image reprocessing
    deskew: false            # Disable to prevent transcoding (major size impact)

# PDF/UA-1 settings - minimal compliance without content structure
pdfua:
  add_identifier: true                      # Essential PDF/UA-1 identifier
  add_xmp_metadata: true                    # Required XMP metadata
  mark_as_tagged: true                      # Mark document as tagged
  add_language: true                        # Document language specification
  create_structure_tree: false             # No auto-generated structure
  add_content_tags: false                   # No auto-generated content tags