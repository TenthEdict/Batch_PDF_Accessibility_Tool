# Adaptive ML Configuration
# Configuration for intelligent document learning and enhancement

adaptive_ml:
  # Learning system configuration
  learning:
    enabled: true
    min_samples_for_learning: 5
    confidence_threshold: 0.7
    learning_rate: 0.1
    max_patterns: 1000
    pattern_similarity_threshold: 0.8
    
    # Feature extraction settings
    feature_extraction:
      text_features: true
      structural_features: true
      visual_features: true
      metadata_features: true
      
    # Pattern learning settings
    pattern_learning:
      min_confidence_increase: 0.05
      max_pattern_age_days: 365
      pattern_cleanup_interval_hours: 24
      
  # Model configuration
  models:
    # Document pattern classifier
    pattern_classifier:
      model_type: "random_forest"
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      random_state: 42
      
    # Text quality predictor
    text_quality_predictor:
      model_name: "distilbert-base-uncased"
      max_length: 512
      use_gpu: true
      confidence_threshold: 0.6
      
    # OCR parameter optimizer
    ocr_parameter_optimizer:
      model_type: "neural_network"
      hidden_layers: [128, 64]
      dropout_rate: 0.3
      learning_rate: 0.001
      batch_size: 32
      
  # Cache and storage configuration
  cache:
    enabled: true
    cache_dir: "~/.cache/epubs/adaptive_ml"
    max_cache_size_gb: 5.0
    cleanup_interval_days: 7
    backup_patterns: true
    backup_interval_hours: 24
    
  # Performance settings
  performance:
    batch_size: 16
    max_workers: 4
    timeout_seconds: 60
    memory_limit_mb: 2048
    gpu_memory_fraction: 0.8
    
  # Quality assessment settings
  quality_assessment:
    min_confidence_score: 30.0
    min_text_length: 100
    max_processing_time_seconds: 300
    quality_metrics:
      - "confidence_score"
      - "text_length"
      - "word_count"
      - "unique_words_ratio"
      - "processing_time"
      
  # Feedback and learning settings
  feedback:
    collect_feedback: true
    feedback_storage: "local"
    feedback_retention_days: 90
    anonymize_feedback: true
    
    # Learning triggers
    learning_triggers:
      - "low_confidence"
      - "processing_failure"
      - "quality_improvement"
      - "new_document_type"
      
  # Integration settings
  integration:
    # When to use adaptive ML (default for academic documents)
    triggers:
      - "default"      # Use by default for all processing
      - "academic"     # Use in academic processing mode
      - "advanced"     # Use in advanced processing mode
      - "batch"        # Use in batch processing
      
    # Default capabilities to run
    default_capabilities:
      - "pattern_matching"
      - "quality_prediction"
      - "ocr_optimization"
      - "learning"
      
    # Output configuration
    output:
      save_analysis_results: true
      include_in_metadata: true
      results_format: "json"
      embed_in_pdf: false
      
# Intelligent OCR configuration
intelligent_ocr:
  # OCR processing settings (default for academic documents)
  processing:
    intelligent_detection: true
    fallback_to_standard: true
    quality_threshold: 0.5
    confidence_threshold: 30.0
    use_by_default: true  # Use intelligent OCR by default
    
    # Preprocessing settings
    preprocessing:
      denoise: true
      enhance_contrast: true
      deskew: true
      sharpen: true
      
    # OCR parameter optimization
    parameter_optimization:
      enabled: true
      search_space:
        psm: [1, 3, 6, 8, 11, 13]
        oem: [1, 3]
        dpi: [150, 200, 300]
      optimization_method: "bayesian"
      max_trials: 10
      
  # Quality assessment
  quality_assessment:
    enabled: true
    metrics:
      - "confidence_score"
      - "text_length"
      - "word_count"
      - "sentence_count"
      - "unique_words_ratio"
      - "processing_time"
      
    # Quality thresholds
    thresholds:
      excellent: 0.8
      good: 0.6
      acceptable: 0.4
      poor: 0.2
      
  # Learning and feedback
  learning:
    enabled: true
    learn_from_success: true
    learn_from_failure: true
    update_patterns: true
    
    # Feedback collection
    feedback:
      collect_user_feedback: false
      collect_automatic_feedback: true
      feedback_retention_days: 180
      
# Document pattern learning
document_patterns:
  # Pattern types to learn
  pattern_types:
    - "academic_paper"
    - "research_document"
    - "data_document"
    - "long_document"
    - "general_document"
    - "image_heavy_document"
    - "table_heavy_document"
    - "equation_heavy_document"
    
  # Feature extraction for patterns
  features:
    text_features:
      - "text_length"
      - "word_count"
      - "avg_word_length"
      - "sentence_count"
      - "paragraph_count"
      - "unique_words_ratio"
      - "avg_sentence_length"
      
    content_features:
      - "has_citations"
      - "has_equations"
      - "has_tables"
      - "has_figures"
      - "has_headings"
      - "has_lists"
      
    structural_features:
      - "total_pages"
      - "file_size_mb"
      - "avg_text_length_per_page"
      - "avg_words_per_page"
      - "is_academic"
      - "is_image_heavy"
      
  # Pattern matching
  matching:
    similarity_threshold: 0.7
    confidence_threshold: 0.5
    max_patterns_per_document: 5
    pattern_weighting:
      recent_patterns: 1.2
      high_confidence_patterns: 1.1
      successful_patterns: 1.3
      
# Success rate prediction
success_prediction:
  enabled: true
  prediction_method: "ensemble"
  models:
    - "pattern_based"
    - "feature_based"
    - "quality_based"
    
  # Prediction thresholds
  thresholds:
    high_success: 0.8
    medium_success: 0.6
    low_success: 0.4
    
  # Continuous improvement
  improvement:
    track_predictions: true
    update_models: true
    retrain_interval_days: 30
    min_samples_for_retraining: 50
