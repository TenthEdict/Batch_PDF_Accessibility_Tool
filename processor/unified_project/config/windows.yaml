# Windows-specific configuration for ePubs Accessibility Enhancement Project

# General settings optimized for Windows
general:
  logging_level: INFO
  # Use Windows TEMP directory
  temp_directory: ${TEMP}/epubs_temp

# OCR settings for Windows
ocr:
  engine: tesseract
  language: eng
  # Windows-specific Tesseract paths (will auto-detect)
  tesseract_cmd: tesseract  # Assumes PATH is configured
  # Alternative manual paths if auto-detection fails:
  # tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  # tesseract_cmd: "C:/Program Files (x86)/Tesseract-OCR/tesseract.exe"
  
  historical:
    enabled: false
    language_resources: 
      - historical_pre1800
      - historical_19thC
      - historical_early20thC
  math:
    enabled: false

# Enhancement settings
enhancement:
  basic:
    deskew: true
    binarize: true
    denoise: true
  advanced:
    detect_headers: true
    detect_paragraphs: true
    detect_tables: true
    detect_images: true
  ua:
    tag_structure: true
    add_alt_text: true
    optimize_reading_order: true

# Validation settings
validation:
  check_tagging: true
  check_alt_text: true
  check_reading_order: true
  check_language: true
  generate_report: true

# Metadata settings
metadata:
  add_language: true
  add_title: true
  add_author: true
  mark_as_tagged: true
  add_pdfua_identifier: true

# Windows-specific system settings
system:
  # Use Windows-style path separators
  path_separator: "\\"
  # Default file locations
  default_input_dir: "%USERPROFILE%/Documents/ePubs/Input"
  default_output_dir: "%USERPROFILE%/Documents/ePubs/Output"
  # Windows performance optimizations
  memory_limit: auto  # Auto-detect available memory
  max_processes: auto  # Auto-detect CPU cores