# Default configuration for ePubs Accessibility Enhancement Project

# General settings
general:
  logging_level: INFO
  temp_directory: /tmp/epubs_temp

# OCR settings
ocr:
  engine: tesseract
  language: eng
  historical:
    enabled: false
    language_resources: 
      - historical_pre1800
      - historical_19thC
      - historical_early20thC
  math:
    enabled: false

# Enhancement settings
enhancement:
  basic:
    deskew: true
    binarize: true
    denoise: true
  advanced:
    detect_headers: true
    detect_paragraphs: true
    detect_tables: true
    detect_images: true
  ua:
    tag_structure: true
    add_alt_text: true
    optimize_reading_order: true

# Validation settings
validation:
  check_tagging: true
  check_alt_text: true
  check_reading_order: true
  check_language: true
  generate_report: true

# Adobe PDF Services AutoTag configuration
adobe_autotag:
  enabled: true                    # Enable Adobe AutoTag when credentials available
  generate_report: false          # Disable reports by default for general documents
  shift_headings: false           # Conservative heading structure for general documents
  timeout: 180                    # Shorter timeout for general processing (3 minutes)
  fallback_to_local: true         # Always fallback to local processing if Adobe fails
  
  # General document settings
  processing_options:
    preserve_original_structure: true  # Maintain original document structure
    basic_accessibility_only: false   # Use full Adobe AutoTag capabilities
    optimize_for_screen_readers: true # Optimize output for assistive technology

# Metadata settings
metadata:
  add_language: true
  add_title: true
  add_author: true
  mark_as_tagged: true
  add_pdfua_identifier: true