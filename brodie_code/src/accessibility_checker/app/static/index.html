<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Accessibility Processor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">PDF Accessibility Processor</h1>
            <p class="text-gray-600">Upload your PDFs for accessibility analysis and enhancement</p>
        </header>

        <!-- Upload Area -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div 
                id="dropZone" 
                class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center transition-colors duration-200 ease-in-out hover:border-blue-500"
                ondragover="handleDragOver(event)"
                ondrop="handleDrop(event)">
                <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-4"></i>
                <p class="text-gray-600 mb-2">Drag and drop PDF files here, or</p>
                <button 
                    onclick="document.getElementById('fileInput').click()" 
                    class="text-blue-500 hover:text-blue-700">
                    browse to upload
                </button>
                <input 
                    type="file" 
                    id="fileInput" 
                    multiple 
                    accept=".pdf" 
                    class="hidden"
                    onchange="handleFileSelect(event)">
            </div>

            <!-- File List -->
            <div id="fileList" class="mt-4 space-y-2"></div>

            <!-- Process Button -->
            <button 
                id="processButton" 
                onclick="processFiles()" 
                class="w-full mt-4 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600 disabled:bg-blue-300 disabled:cursor-not-allowed hidden">
                Process Files
            </button>
        </div>

        <!-- Results Area -->
        <div id="resultsArea" class="bg-white rounded-lg shadow-md p-6 hidden">
            <h2 class="text-xl font-semibold mb-4">Processing Results</h2>
            <div id="resultsList" class="space-y-2"></div>
        </div>

        <!-- Processing Status -->
        <div id="processingStatus" class="text-center py-4 hidden">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
            <p class="text-gray-600 mt-2">Processing files...</p>
        </div>
    </div>

    <script>
        let files = [];
        let currentJobId = null;

        function updateUI() {
            const fileList = document.getElementById('fileList');
            const processButton = document.getElementById('processButton');
            
            fileList.innerHTML = files.map((file, index) => `
                <div class="flex items-center justify-between bg-gray-50 p-2 rounded">
                    <div class="flex items-center">
                        <i class="far fa-file-pdf text-red-500 mr-2"></i>
                        <span class="text-gray-700">${file.name}</span>
                    </div>
                    <button 
                        onclick="removeFile(${index})" 
                        class="text-red-500 hover:text-red-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');

            processButton.classList.toggle('hidden', files.length === 0);
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.stopPropagation();
        }

        function handleDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            
            const droppedFiles = Array.from(event.dataTransfer.files)
                .filter(file => file.type === 'application/pdf');
            
            files = [...files, ...droppedFiles];
            updateUI();
        }

        function handleFileSelect(event) {
            const selectedFiles = Array.from(event.target.files)
                .filter(file => file.type === 'application/pdf');
            
            files = [...files, ...selectedFiles];
            updateUI();
        }

        function removeFile(index) {
            files.splice(index, 1);
            updateUI();
        }

        async function processFiles() {
            if (files.length === 0) return;

            const formData = new FormData();
            files.forEach(file => formData.append('files', file));

            document.getElementById('processingStatus').classList.remove('hidden');
            document.getElementById('processButton').disabled = true;

            try {
                const response = await fetch('/api/process/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Processing failed');

                const data = await response.json();
                currentJobId = data.job_id;
                pollJobStatus();

            } catch (error) {
                console.error('Error:', error);
                alert('Error processing files. Please try again.');
                document.getElementById('processingStatus').classList.add('hidden');
                document.getElementById('processButton').disabled = false;
            }
        }

        async function pollJobStatus() {
            if (!currentJobId) return;

            try {
                const response = await fetch(`/api/status/${currentJobId}`);
                const data = await response.json();

                if (data.status === 'completed') {
                    showResults(data.results);
                    currentJobId = null;
                } else if (data.status === 'failed') {
                    throw new Error('Processing failed');
                } else {
                    setTimeout(pollJobStatus, 2000);
                }

            } catch (error) {
                console.error('Error:', error);
                alert('Error checking job status. Please try again.');
                document.getElementById('processingStatus').classList.add('hidden');
                document.getElementById('processButton').disabled = false;
            }
        }

        function showResults(results) {
            document.getElementById('processingStatus').classList.add('hidden');
            document.getElementById('processButton').disabled = false;
            
            const resultsArea = document.getElementById('resultsArea');
            const resultsList = document.getElementById('resultsList');
            
            resultsList.innerHTML = results.map(result => `
                <div class="border-b border-gray-200 py-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <i class="fas ${result.status === 'success' ? 'fa-check text-green-500' : 'fa-exclamation-triangle text-yellow-500'} mr-2"></i>
                            <span class="font-medium">${result.filename}</span>
                        </div>
                        <span class="text-sm text-gray-600">
                            ${result.violations} violations found
                        </span>
                    </div>
                    ${result.status === 'success' ? `
                        <div class="mt-2 space-x-2">
                            <a href="/api/download/pdf/${result.filename}" 
                               class="text-sm text-blue-500 hover:text-blue-700">
                                <i class="fas fa-download mr-1"></i>Download Processed PDF
                            </a>
                            <a href="/api/download/report/${result.filename.replace('.pdf', '_report.json')}" 
                               class="text-sm text-blue-500 hover:text-blue-700">
                                <i class="fas fa-file-alt mr-1"></i>View Report
                            </a>
                        </div>
                    ` : ''}
                </div>
            `).join('');

            resultsArea.classList.remove('hidden');
        }
    </script>
</body>
</html>
