# config.yaml

max_workers: 4
batch_size: 10
timeout: 300
retry_count: 3

ocr:
  # Base OCR settings
  language: eng
  psm: 3
  oem: 3
  char_whitelist: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+-=×÷()[]{}πΣ∫∂√∞∈∀∃≠≤≥±αβγδεθλμπσφω
  
  # Adaptive OCR settings
  adaptive:
    enabled: true
    min_confidence_threshold: 60.0
    preprocessing:
      enable_contrast_enhancement: true
      enable_denoising: true
      enable_sharpening: true
      enable_deskewing: true
    
    # PSM mode mappings for different document types
    psm_modes:
      simple: 3
      complex: 6
      table_heavy: 4
      mixed: 11
      single_column: 1
      multi_column: 2
    
    # Thresholds for document classification
    thresholds:
      layout_complexity: 0.7
      text_density: 0.4
      min_font_size: 10
      quality_score: 0.6
      skew_angle: 0.5
      historical_detection_threshold: 0.35
      yellowing_threshold: 0.5
      faded_text_threshold: 0.6
    
  # Additional Tesseract parameters
  additional_params:
    preserve_interword_spaces: 1
    textord_heavy_nr: 1
    
    # Math-specific settings
    math_ocr:
      enabled: true
      min_confidence: 60.0
      merge_threshold: 20
      
    # Table detection settings
    table_detection:
      min_lines: 3
      min_confidence: 70.0
      line_thickness_range: [1, 5]
      
    # Image enhancement settings
    image_enhancement:
      contrast_clip_limit: 2.0
      contrast_grid_size: 8
      denoise_strength: 10
      sharpen_strength: 1.5
      
    # Script detection settings
    script_detection:
      latin_ratio_threshold: 0.5
      min_chars_for_detection: 20
      
    # Historical document settings
    historical_document:
      enabled: true
      # Historical preprocessing settings
      preprocessing:
        contrast_clip_limit: 3.0
        denoise_strength: 13
        sharpen_kernel_size: 3
        adaptive_block_size: 9
        historical_char_whitelist: "ſƺȝȣþðæœ"
      
      # Historical font settings
      fonts:
        blackletter:
          textord_old_graphemes: 1
          psm: 6
          oem: 2
          classify_character_fragments: 0  # Avoid fragmenting characters in old fonts
          chop_enable: 0  # Don't chop joined characters, common in historical prints
        old_style_serif:
          psm: 6
          oem: 2
          textord_really_old_xheight: 1  # For very old documents with varied x-heights
          textord_noise_certaintity: 1.5  # Higher certainty for noise detection
        decorative_script:
          psm: 8  # Treat as single word with decorative font
          oem: 2
          edges_max_children_per_outline: 20  # Allow more points in decorative characters
      
      # Advanced OCR parameters for historical documents
      tesseract_params:
        # Character recognition parameters
        matcher_good_threshold: 0.35  # Lower confidence threshold for accepting historical characters
        matcher_bad_match_pad: 0.15  # More tolerance for imperfect matches
        tessedit_consistent_reps: 1  # Be consistent with character repetitions, helps with old fonts
        edges_boxarea: 0.8  # More lenient with broken character edges
        
        # Language model parameters
        language_model_penalty_non_freq_dict_word: 0.1  # Lower penalty for uncommon words
        language_model_ngram_scale_factor: 0.05  # Lower reliance on modern language patterns
        
        # Page segmentation parameters
        textord_noise_sizelimit: 0.2  # Larger noise size limit for historical documents
        textord_fp_chop_error: 1.5  # More tolerance for chopping errors
        
        # Dictionary settings
        user_words_suffix: "historical_words"  # Use historical words dictionary
        user_patterns_suffix: "historical_patterns"  # Use historical patterns dictionary
      
      # Historical word dictionaries by era
      dictionaries:
        # Paths are relative to tessdata/configs directory
        pre_1800:
          filename: "historical_pre1800.txt"
          enabled: true
        nineteenth_century:
          filename: "historical_19thC.txt"
          enabled: true
        early_twentieth_century:
          filename: "historical_early20thC.txt"
          enabled: true
      
      # Condition-based adjustments
      condition_adjustments:
        yellowed_paper:
          textord_min_linesize: 2.0
          thresholding: "adaptive"
          edges_children_count_limit: 45  # More points for characters on yellowed paper
          
        faded_text:
          enhance_resolution: true
          textord_min_xheight: 3
          edges_min_nonhole: 12  # Lower threshold for edges in faded text
          classify_min_pattern_size_for_pruning: 0.2  # Allow smaller patterns
          
        damaged_pages:
          edges_pathname_child_area_ratio: 0.6  # More tolerance for damaged areas
          textord_noise_rejrows: true  # Try to identify and reject noisy rows
          textord_noise_rejcols: true  # Try to identify and reject noisy columns
          
        handwritten_annotations:
          classify_enable_learning: 1  # Enable learning for adaptive recognition
          textord_really_old_xheight: 1  # Handle variable-height characters
